<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure Mail Console - Login</title>

    <meta name="theme-color" content="#0b1020">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            color: #f8fafc;
            background:
                radial-gradient(
                    circle at top left,
                    rgba(37, 99, 235, 0.20),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(124, 58, 237, 0.16),
                    transparent 35%
                ),
                #0b1020;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 38px 32px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 20px;
            background: rgba(17, 24, 39, 0.94);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.40);
        }

        .logo {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            border-radius: 18px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            font-size: 29px;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            margin-top: 10px;
            margin-bottom: 30px;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
        }

        .field-label {
            display: block;
            margin-bottom: 10px;
            color: #e2e8f0;
            font-size: 13px;
            font-weight: 600;
        }

        .password-wrap {
            position: relative;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 48px 0 15px;
            outline: none;
            border: 1px solid #334155;
            border-radius: 11px;
            background: #0f172a;
            color: #ffffff;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        input::placeholder {
            color: #64748b;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 13px;
            transform: translateY(-50%);
            padding: 5px;
            border: none;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            font-size: 12px;
        }

        .toggle-password:hover {
            color: #ffffff;
        }

        .error {
            margin-top: 15px;
            padding: 12px 14px;
            border: 1px solid rgba(248, 113, 113, 0.25);
            border-radius: 10px;
            background: rgba(127, 29, 29, 0.20);
            color: #fca5a5;
            font-size: 13px;
            line-height: 1.5;
        }

        .login-button {
            width: 100%;
            height: 50px;
            margin-top: 22px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
        }

        .login-button:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .security-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-top: 25px;
            color: #64748b;
            font-size: 12px;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            color: #475569;
            font-size: 11px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 22px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <main class="login-card">

        <div class="logo">✉</div>

        <h1>Secure Mail Console</h1>

        <p class="subtitle">
            Sign in to access your email dashboard.
            Your account is protected.
        </p>

        <form method="POST" action="/login" autocomplete="on">

            <label class="field-label" for="password">
                Dashboard Password
            </label>

            <div class="password-wrap">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                    autofocus
                >

                <button
                    type="button"
                    class="toggle-password"
                    id="togglePassword"
                    aria-label="Show password"
                >
                    SHOW
                </button>

            </div>

            {% if error %}
                <div class="error" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <button type="submit" class="login-button">
                Sign In →
            </button>

        </form>

        <div class="security-note">
            <span>🔒</span>
            <span>Secure password-protected access</span>
        </div>

        <div class="footer">
            Secure Mail Console
        </div>

    </main>

    <script>
        const passwordInput = document.getElementById("password");
        const toggleButton = document.getElementById("togglePassword");

        toggleButton.addEventListener("click", function () {

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleButton.textContent = "HIDE";
                toggleButton.setAttribute("aria-label", "Hide password");
            } else {
                passwordInput.type = "password";
                toggleButton.textContent = "SHOW";
                toggleButton.setAttribute("aria-label", "Show password");
            }

        });
    </script>

</body>
</html>
