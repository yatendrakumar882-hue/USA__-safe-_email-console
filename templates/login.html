<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Secure Mail Console - Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body class="login-page">

    <main class="login-card">

        <div class="brand-mark">
            ✉
        </div>

        <p class="eyebrow">
            PRIVATE WORKSPACE
        </p>

        <h1>
            Secure Mail Console
        </h1>

        <p class="muted">
            Sign in to access your email workspace.
        </p>


        {% if error %}

        <div class="alert error">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="post"
            action="{{ url_for('login') }}"
        >

            <label for="password">
                Workspace password
            </label>

            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                autofocus
            >

            <button
                class="primary full"
                type="submit"
            >
                Sign in securely
            </button>

        </form>


        <p class="tiny muted">
            Protected by your Vercel LOGIN_PASSWORD setting.
        </p>

    </main>

</body>
</html>
